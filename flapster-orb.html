<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FLAPSTER ORB</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--a:#7dd3fc;--b:#c084fc;--g:#fbbf24;--d:#fb7185;--t:#eef2ff;--gl:rgba(14,17,32,.42);--bd:rgba(255,255,255,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--t:#eef2ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:var(--t);font-family:'Manrope','Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:0 10px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);border-radius:20px}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .5s;z-index:10}
#hud.on{opacity:1}
#best{padding:8px 14px;font-size:11px;text-align:center}#best b{display:block;font:800 17px 'Unbounded',sans-serif;color:var(--g)}
#sc{text-align:center;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px)}
#sv{font:800 54px/1 'Unbounded',sans-serif;text-shadow:0 0 28px rgba(125,211,252,.55)}
#sv.pop{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{40%{transform:scale(1.3)}}
#combo{height:20px;margin-top:6px;font:700 12px 'Manrope';letter-spacing:.14em;color:var(--g);opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
.btns{display:flex;gap:8px;pointer-events:auto}
.ib{width:46px;height:46px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ib svg{width:18px;height:18px;fill:var(--t)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .6s}
.screen.on{opacity:1;pointer-events:auto}
.panel{padding:44px 46px;text-align:center;max-width:430px;width:90%;transform:translateY(16px) scale(.97);transition:transform .6s cubic-bezier(.2,1,.3,1)}
.screen.on .panel{transform:none}
h1{font:800 40px/1.05 'Unbounded',sans-serif;margin:0 0 8px;background:linear-gradient(120deg,var(--a),var(--b) 60%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(125,211,252,.35))}
.sub{font-size:13px;opacity:.6;margin-bottom:26px}
.row{display:flex;justify-content:center;gap:34px;margin:0 0 24px}
.row div{display:flex;flex-direction:column;align-items:center}.row b{font:800 32px 'Unbounded',sans-serif}.row b.g{color:var(--g)}.row span{font-size:11px;opacity:.55;margin-top:4px}
.medal{font:700 14px 'Manrope';margin-bottom:16px;color:var(--g)}
.badge{display:inline-block;font-size:12px;font-weight:700;color:#05060a;background:linear-gradient(120deg,var(--g),#f59e0b);padding:5px 14px;border-radius:20px;margin-bottom:14px;box-shadow:0 0 24px rgba(251,191,36,.5)}
button.go{appearance:none;border:0;cursor:pointer;padding:15px 40px;font:800 14px 'Unbounded',sans-serif;color:#04060c;border-radius:999px;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 10px 30px rgba(125,211,252,.3);transition:transform .18s;margin:4px}
button.go:hover{transform:translateY(-2px) scale(1.03)}button.go:active{transform:scale(.97)}
button.go.s{background:rgba(255,255,255,.08);color:var(--t);box-shadow:inset 0 0 0 1px var(--bd)}
button:focus-visible,.ib:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.hint{font-size:13px;opacity:.55;margin-top:22px}
.credit{margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);font:500 12px 'Unbounded',sans-serif;letter-spacing:.04em;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#intro{position:fixed;inset:0;z-index:30;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#intro i{display:block;width:180px;height:2px;background:rgba(255,255,255,.12);margin-top:22px;overflow:hidden}
#intro u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
#fl{position:fixed;inset:0;pointer-events:none;z-index:15;background:var(--d);opacity:0;transition:opacity .35s}#fl.hit{opacity:.4;transition:none}
@media(max-width:560px){h1{font-size:30px}.panel{padding:32px 24px}#sv{font-size:44px}}
@media(prefers-reduced-motion:reduce){.badge,#sv.pop{animation:none}}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><div id="fl"></div>
<div id="hud">
 <div id="best" class="glass"><b id="bv">0</b>Best</div>
 <div id="sc"><div id="sv">0</div><div id="combo"></div></div>
 <div class="btns">
  <div class="ib glass" id="mute" role="button" tabindex="0" aria-label="Sound"><svg viewBox="0 0 24 24"><path id="mi" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></div>
  <div class="ib glass" id="pb" role="button" tabindex="0" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></div>
 </div>
</div>
<div id="intro"><div style="font:500 13px 'Unbounded',sans-serif;letter-spacing:.5em;opacity:.7">FLAPSTER ORB</div><i><u id="ib"></u></i></div>
<div id="menu" class="screen"><div class="panel glass"><h1>FLAPSTER<br>ORB</h1><div class="sub">Thread the crystal gates. Skim the edges for bonus points.</div>
 <div class="row"><div><b class="g" id="mb">0</b><span>Best score</span></div></div>
 <button class="go" id="start">Launch</button><div class="hint">Tap, click or press Space to boost</div><div class="credit">Made by Gaurav Mohapatra</div></div></div>
<div id="pause" class="screen"><div class="panel glass"><h1 style="font-size:30px">Paused</h1><div class="sub">Your run is on hold</div>
 <button class="go" id="resume">Resume</button><button class="go s" id="prs">Restart</button></div></div>
<div id="over" class="screen"><div class="panel glass"><div id="nb" class="badge" style="display:none">New best score</div>
 <h1 style="font-size:30px">Impact</h1><div class="medal" id="medal"></div>
 <div class="row"><div><b id="fs">0</b><span>Score</span></div><div><b class="g" id="fb">0</b><span>Best</span></div><div><b id="fc">0</b><span>Close calls</span></div></div>
 <button class="go" id="again">Fly again</button></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CFG={g:-22,flap:7.6,maxFall:-20,maxRise:9,r:.48,gy:-6.6,cy:6.6,cam:new THREE.Vector3(0,2.1,9.2),
 speed:13.5,maxSpeed:30,spScore:.16,gap:4.5,minGap:2.55,gapShrink:.028,space:23,minSpace:15.5,spaceShrink:.08,thick:1.3,pool:7,startZ:-34,fov:58};

/* ---------- Audio (procedural) ---------- */
const Audio={ctx:null,master:null,muted:store.get('nd_mute')==='1',
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.5;this.master.connect(this.ctx.destination);this.drone();this.music()}catch(e){}},
 music(){const c=this.ctx,sp=60/128/4,mf=m=>440*Math.pow(2,(m-69)/12);
  const bus=c.createGain();bus.gain.value=.6;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;bus.connect(lp);lp.connect(this.master);
  const pump=c.createGain();pump.connect(bus);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const m=this.mus={lp,level:.3,cut:1400};
  const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],roots=[33,29,36,31];
  const note=(f,t,d,type,v,dest,a=.01,det=0)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.detune.value=det;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)};
  const noise=(t,d,type,fr,v)=>{const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+d+.02)};
  let step=0,next=c.currentTime+.1;
  setInterval(()=>{if(next<c.currentTime-.1)next=c.currentTime+.05;
   while(next<c.currentTime+.2){const s=step%16,bar=Math.floor(step/16)%4,L=m.level,t=next,ch=chords[bar];
    if(s%4===0){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.3);
     pump.gain.cancelScheduledValues(t);pump.gain.setValueAtTime(.2,t);pump.gain.linearRampToValueAtTime(1,t+sp*3.2)}
    if(s%4===2)noise(t,.05,'highpass',7500,.1+L*.06);
    if(L>.3&&s%2===1)noise(t,.025,'highpass',9000,.04);
    if(L>.15&&(s===4||s===12))noise(t,.14,'bandpass',1800,.22);
    if(s%4===2)note(mf(roots[bar]),t,sp*3,'sawtooth',.34,pump,.005);
    if(s===0)ch.forEach((n,i)=>note(mf(n),t,sp*15,'sawtooth',.05,pump,.25,(i-1)*9));
    if(L>.1){const idx=[0,1,2,1][s%4],oct=s%8>3?24:12;note(mf(ch[idx]+oct),t,sp*1.8,'square',.045+L*.03,pump)}
    step++;next+=sp}},50)},
 mix(st,score,dt){const m=this.mus;if(!m)return;const tl=st===2?Math.min(1,.2+score/25):.3,tc=st===2?16000:st===3?450:st===4?800:1400;
  m.level+=(tl-m.level)*Math.min(1,dt*1.5);m.cut+=(tc-m.cut)*Math.min(1,dt*3);m.lp.frequency.value=m.cut},
 drone(){const c=this.ctx,f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=c.createGain();g.gain.value=.025;f.connect(g);g.connect(this.master);
  [55,55.4,82.5].forEach(fr=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start()});
  const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.08;lg.gain.value=180;l.connect(lg);lg.connect(f.frequency);l.start()},
 tone(f,d,type='sine',v=.2,slide=0,delay=0){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02)},
 flap(){this.tone(380,.14,'triangle',.12,420)},
 score(n){this.tone(660+Math.min(n,12)*30,.22,'sine',.16);this.tone(990+Math.min(n,12)*30,.3,'sine',.09,0,.06)},
 close(){this.tone(1320,.12,'square',.05);this.tone(1760,.25,'sine',.12,0,.07)},
 crash(){this.tone(140,.7,'sawtooth',.35,-110);this.tone(70,.9,'square',.25,-40)},
 toggle(){this.muted=!this.muted;store.set('nd_mute',this.muted?'1':'0');if(this.master)this.master.gain.value=this.muted?0:.5;$('mi').setAttribute('d',this.muted?'M3 9v6h4l5 5V4L7 9H3zm13 0l5 6m0-6l-5 6':'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z')}};
if(Audio.muted)Audio.toggle(),Audio.muted=true;

/* ---------- Textures ---------- */
const TF={
 dot(s=64){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.5,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c)},
 glow(a,b,s=128){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,a);g.addColorStop(.4,b);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c)},
 grid(){const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#060810';x.fillRect(0,0,s,s);x.strokeStyle='rgba(125,211,252,.3)';x.lineWidth=2;for(let i=0;i<=s;i+=s/8){x.beginPath();x.moveTo(i,0);x.lineTo(i,s);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(s,i);x.stroke()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t},
 sky(col){const w=512,h=256,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.moveTo(0,h);let p=0;while(p<w){const ph=h*(.25+Math.random()*.55);x.lineTo(p,h-ph);p+=22+Math.random()*46;x.lineTo(p,h-ph*(.55+Math.random()*.3))}x.lineTo(w,h);x.fill();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}};

/* ---------- Renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene(),fog=new THREE.FogExp2(0x0a0d1a,.021);scene.fog=fog;
const camera=new THREE.PerspectiveCamera(CFG.fov,innerWidth/innerHeight,.1,500);camera.position.set(0,30,40);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.85,.55,.18);composer.addPass(bloom);composer.addPass(new OutputPass());

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0x8fd3ff,0x120a1e,.75),new THREE.AmbientLight(0x1a1030,.55));
const sun=new THREE.DirectionalLight(0xffe3b0,1.6);sun.position.set(-14,22,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});sun.shadow.bias=-.0015;scene.add(sun);
const rim=new THREE.PointLight(0x7dd3fc,1.4,20,2);rim.position.set(0,2,4);scene.add(rim);

/* ---------- Sky ---------- */
const su={top:{value:new THREE.Color(0x0b1030)},bot:{value:new THREE.Color(0x38234f)}};
scene.add(new THREE.Mesh(new THREE.SphereGeometry(220,24,16),new THREE.ShaderMaterial({uniforms:su,side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 w;void main(){w=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 w;void main(){float h=normalize(w+vec3(0.,12.,0.)).y;gl_FragColor=vec4(mix(bot,top,pow(max(h,0.),.7)),1.);}'})));
const sunS=new THREE.Sprite(new THREE.SpriteMaterial({map:TF.glow('rgba(255,240,210,1)','rgba(255,190,110,.55)'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
sunS.scale.set(26,26,1);sunS.position.set(-40,26,-90);scene.add(sunS);
const sp=new Float32Array(1500);for(let i=0;i<500;i++){const r=150+Math.random()*60,th=Math.random()*6.28,ph=Math.acos(Math.random()*.85);sp[i*3]=r*Math.sin(ph)*Math.cos(th);sp[i*3+1]=Math.abs(r*Math.cos(ph))*.9+20;sp[i*3+2]=r*Math.sin(ph)*Math.sin(th)-40}
const starG=new THREE.BufferGeometry();starG.setAttribute('position',new THREE.BufferAttribute(sp,3));
const starM=new THREE.PointsMaterial({size:1.4,transparent:true,opacity:.3,map:TF.dot(),depthWrite:false,blending:THREE.AdditiveBlending,fog:false});scene.add(new THREE.Points(starG,starM));

/* ---------- Environment ---------- */
const gt=TF.grid();gt.repeat.set(6,60);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,400),new THREE.MeshStandardMaterial({map:gt,roughness:.6,metalness:.4,emissive:0x0a1830,emissiveIntensity:.3}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,CFG.gy,-140);ground.receiveShadow=true;scene.add(ground);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(40,400),new THREE.MeshStandardMaterial({map:gt,transparent:true,opacity:.3,emissive:0x2a1440,emissiveIntensity:.25}));
ceil.rotation.x=Math.PI/2;ceil.position.set(0,CFG.cy,-140);scene.add(ceil);
const bg=[[-110,90,'rgba(30,18,55,.9)',.55,.02],[-150,130,'rgba(20,14,40,.85)',.4,.012],[-190,170,'rgba(14,10,28,.8)',.3,.006]].map(([z,s,c,o,p])=>{
 const t=TF.sky(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(s*2.2,s),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:o,depthWrite:false,fog:false}));m.position.set(0,s*.28,z);m.userData.p=p;scene.add(m);return m});

/* ambient dust */
const AN=240,ag=new THREE.BufferGeometry(),ap=new Float32Array(AN*3);
for(let i=0;i<AN;i++){ap[i*3]=(Math.random()-.5)*26;ap[i*3+1]=(Math.random()-.5)*16;ap[i*3+2]=-Math.random()*90}
ag.setAttribute('position',new THREE.BufferAttribute(ap,3));
scene.add(new THREE.Points(ag,new THREE.PointsMaterial({size:.22,map:TF.dot(),transparent:true,opacity:.55,color:0x9fe3ff,blending:THREE.AdditiveBlending,depthWrite:false})));

/* speed lines */
const SL=reduce?0:70,sg=new THREE.BufferGeometry(),slp=new Float32Array(SL*6),slLen=new Float32Array(SL);
function resetLine(i,far){const a=Math.random()*6.28,r=3+Math.random()*9,z=far?-60-Math.random()*40:-Math.random()*100;slLen[i]=2+Math.random()*4;
 slp[i*6]=slp[i*6+3]=Math.cos(a)*r;slp[i*6+1]=slp[i*6+4]=Math.sin(a)*r*.6;slp[i*6+2]=z;slp[i*6+5]=z-slLen[i]}
for(let i=0;i<SL;i++)resetLine(i,false);
sg.setAttribute('position',new THREE.BufferAttribute(slp,3));
const slM=new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.LineSegments(sg,slM));

/* ---------- Player ---------- */
const player=new THREE.Group();scene.add(player);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,2),new THREE.MeshPhysicalMaterial({color:0x66e3ff,metalness:.25,roughness:.12,clearcoat:1,emissive:0x1a5cff,emissiveIntensity:.5}));core.castShadow=true;player.add(core);
const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.24,1),new THREE.MeshBasicMaterial({color:0xffffff}));player.add(inner);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:TF.dot(),color:0x7dd3fc,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));halo.scale.set(2.6,2.6,1);player.add(halo);
const pl=new THREE.PointLight(0x7dd3fc,1.4,8,2);player.add(pl);
const wm=new THREE.MeshStandardMaterial({color:0xc084fc,emissive:0x6d28d9,emissiveIntensity:.7,metalness:.4,roughness:.35,transparent:true,opacity:.85});
const wL=new THREE.Mesh(new THREE.ConeGeometry(.42,.9,4),wm);wL.rotation.z=Math.PI/2;wL.position.set(-.55,0,.1);player.add(wL);
const wR=wL.clone();wR.rotation.z=-Math.PI/2;wR.position.x=.55;player.add(wR);
let flapPhase=0;

/* trail */
const TN=34,trail=[];
for(let i=0;i<TN;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TF.dot(),color:0x7dd3fc,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));s.visible=false;scene.add(s);trail.push({s,life:0})}
let trailT=0,trailI=0;
function emitTrail(){const t=trail[trailI++%TN];t.life=1;t.s.visible=true;t.s.position.copy(player.position).add(new THREE.Vector3((Math.random()-.5)*.2,(Math.random()-.5)*.2,.3))}
function updTrail(dt,sp){trail.forEach(t=>{if(!t.s.visible)return;t.life-=dt*1.8;if(t.life<=0){t.s.visible=false;return}t.s.position.z+=sp*dt;t.s.material.opacity=t.life*.7;t.s.scale.setScalar(.15+t.life*.7)})}

/* shockwave rings */
const rings=[];
for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),new THREE.MeshBasicMaterial({color:0x7dd3fc,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));m.visible=false;scene.add(m);rings.push({m,t:1})}
let ringI=0;
function ring(color){const r=rings[ringI++%3];r.t=0;r.m.visible=true;r.m.material.color.set(color);r.m.position.copy(player.position)}
function updRings(dt){rings.forEach(r=>{if(!r.m.visible)return;r.t+=dt*2.2;if(r.t>=1){r.m.visible=false;return}const e=1-Math.pow(1-r.t,3);r.m.scale.setScalar(1+e*6);r.m.material.opacity=(1-r.t)*.8})}

/* ---------- Obstacles ---------- */
function pillar(h,hue){const col=new THREE.Color().setHSL(hue,.65,.55),geo=new THREE.CylinderGeometry(.75,.95,h,6,1);
 const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,metalness:.5,roughness:.25,emissive:col.clone().multiplyScalar(.4),emissiveIntensity:.6}));m.castShadow=true;
 m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:col.clone().offsetHSL(0,0,.25),transparent:true,opacity:.9})));return m}
class Obstacle{
 constructor(i){this.group=new THREE.Group();this.hue=Math.random();this.top=pillar(10,this.hue);this.bot=pillar(10,this.hue);
  this.gate=new THREE.Mesh(new THREE.TorusGeometry(1,.035,8,40),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(this.hue,.8,.7),transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));
  this.group.add(this.top,this.bot,this.gate);scene.add(this.group);this.reset(CFG.startZ-i*CFG.space,0)}
 reset(z,score){const gap=Math.max(CFG.minGap,CFG.gap-score*CFG.gapShrink),range=CFG.cy-CFG.gy-gap-1.6,c=CFG.gy+.8+gap/2+Math.random()*Math.max(range,.2);
  this.hue=(this.hue+.13)%1;const col=new THREE.Color().setHSL(this.hue,.65,.55);
  [this.top,this.bot].forEach(p=>{p.material.color.copy(col);p.material.emissive.copy(col).multiplyScalar(.4);p.children[0].material.color.copy(col).offsetHSL(0,0,.25)});this.gate.material.color.setHSL(this.hue,.8,.7);
  this.group.position.set(0,0,z);this.top.position.y=c+gap/2+5;this.bot.position.y=c-gap/2-5;this.gate.position.y=c;this.gate.scale.setScalar(gap*.5);
  this.gc=c;this.gs=gap;this.passed=false;this.spawnT=0;this.group.scale.setScalar(.001)}
 update(dt,sp){this.group.position.z+=sp*dt;if(this.spawnT<1){this.spawnT=Math.min(1,this.spawnT+dt*2.2);this.group.scale.setScalar(1-Math.pow(1-this.spawnT,3))}this.gate.rotation.z+=dt*.8}}
const obs=[];for(let i=0;i<CFG.pool;i++)obs.push(new Obstacle(i));
const furthest=()=>obs.reduce((m,o)=>Math.min(m,o.group.position.z),0);

/* debris */
const deb=[];for(let i=0;i<30;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.12),new THREE.MeshStandardMaterial({color:0x7dd3fc,emissive:0x7dd3fc,emissiveIntensity:.9,transparent:true}));m.visible=false;scene.add(m);deb.push({m,v:new THREE.Vector3(),a:new THREE.Vector3(),l:0,ml:1})}
function burst(p){deb.forEach(d=>{d.m.visible=true;d.m.position.copy(p);d.m.scale.setScalar(.6+Math.random()*.8);d.v.set((Math.random()-.5)*10,Math.random()*7+1.5,(Math.random()-.5)*10);d.a.set(Math.random()*6,Math.random()*6,0);d.l=0;d.ml=1+Math.random()*.6})}
function updDeb(dt){deb.forEach(d=>{if(!d.m.visible)return;d.l+=dt;if(d.l>=d.ml){d.m.visible=false;return}d.v.y+=CFG.g*.5*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.a.x*dt;d.m.rotation.y+=d.a.y*dt;d.m.material.opacity=1-d.l/d.ml})}

/* ---------- State ---------- */
const S={INTRO:0,MENU:1,PLAY:2,PAUSE:3,OVER:4};let state=S.INTRO;
let vy=0,score=0,combo=0,closeCalls=0,best=Number(store.get('novaDrift_best')||0),trauma=0,timeScale=1,elapsed=0,introStart=null,spacing=CFG.space,fovKick=0,comboTimer=0;
$('bv').textContent=$('mb').textContent=best;
const lerp=(a,b,t)=>a+(b-a)*t,fl=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt)),speedNow=()=>Math.min(CFG.maxSpeed,CFG.speed+score*CFG.spScore);
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

function showScore(){const e=$('sv');e.textContent=score;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function showCombo(){const c=$('combo');if(combo>=2){c.textContent='CLOSE CALL x'+combo;c.classList.add('on');comboTimer=1.6}else c.classList.remove('on')}
function reset(){score=0;combo=0;closeCalls=0;vy=0;player.position.set(0,0,0);player.rotation.set(0,0,0);timeScale=1;trauma=0;spacing=CFG.space;
 let z=CFG.startZ;obs.forEach(o=>{o.reset(z,0);z-=CFG.space;o.group.scale.setScalar(1);o.spawnT=1});$('sv').textContent=0;$('combo').classList.remove('on')}
function flap(){if(state!==S.PLAY)return;vy=CFG.flap;flapPhase=1;rim.intensity=3.4;Audio.flap();for(let i=0;i<3;i++)emitTrail()}
function start(){Audio.init();if(Audio.ctx&&Audio.ctx.state==='suspended')Audio.ctx.resume();['menu','over','pause'].forEach(k=>$(k).classList.remove('on'));reset();state=S.PLAY;$('hud').classList.add('on')}
function toggle(){if(state===S.PLAY){state=S.PAUSE;$('pause').classList.add('on')}else if(state===S.PAUSE){state=S.PLAY;$('pause').classList.remove('on')}}
function medal(s){return s>=40?'Nova Class':s>=25?'Gold Pilot':s>=12?'Silver Pilot':s>=5?'Bronze Pilot':'Cadet'}
function over(){state=S.OVER;trauma=1;$('fl').classList.add('hit');setTimeout(()=>$('fl').classList.remove('hit'),90);burst(player.position);timeScale=.15;setTimeout(()=>timeScale=1,260);Audio.crash();buzz(120);
 const nb=score>best;if(nb){best=score;store.set('novaDrift_best',String(best))}
 $('nb').style.display=nb?'inline-block':'none';$('bv').textContent=$('mb').textContent=$('fb').textContent=best;$('fs').textContent=score;$('fc').textContent=closeCalls;$('medal').textContent=medal(score);
 setTimeout(()=>{$('hud').classList.remove('on');$('over').classList.add('on')},650)}

function gameplay(dt){
 const py=player.position.y;
 if(py-CFG.r<CFG.gy||py+CFG.r>CFG.cy){over();return}
 const sp=speedNow();
 for(const o of obs){
  const z=o.group.position.z,hT=CFG.thick/2+CFG.r;
  if(!o.passed&&z>0){o.passed=true;
   const half=o.gs/2-CFG.r*.6,margin=Math.min(py-(o.gc-half),(o.gc+half)-py)+CFG.r*.6;
   if(margin<.45){combo++;closeCalls++;score+=2;Audio.close();ring(0xfbbf24);buzz(15);fovKick=1}else{combo=0;score++;Audio.score(score);ring(0x7dd3fc)}
   showScore();showCombo()}
  if(Math.abs(z)<hT){const half=o.gs/2-CFG.r*.6;if(py<o.gc-half||py>o.gc+half){over();return}}
  o.update(dt,sp);
  if(o.group.position.z>12)o.reset(furthest()-spacing,score)}
 spacing=Math.max(CFG.minSpace,CFG.space-score*CFG.spaceShrink)}

function updPlayer(dt,t){
 if(state===S.PLAY){vy=Math.max(CFG.maxFall,Math.min(CFG.maxRise,vy+CFG.g*dt));player.position.y+=vy*dt;
  const tl=THREE.MathUtils.clamp(vy*.09,-.6,.9);player.rotation.x=fl(player.rotation.x,-tl,8,dt);player.rotation.z=fl(player.rotation.z,-tl*.3,8,dt);
  trailT+=dt;if(trailT>.035){trailT=0;emitTrail()}}
 else if(state<=S.MENU){player.position.y=Math.sin(t*2)*.4;player.rotation.z=Math.sin(t*1.3)*.08;player.rotation.x=0}
 core.rotation.y+=dt*.6;inner.rotation.y-=dt*1.1;inner.scale.setScalar(1+Math.sin(t*4)*.08);halo.material.opacity=.55+Math.sin(t*3)*.15;
 flapPhase=Math.max(0,flapPhase-dt*3.2);const fa=Math.sin(flapPhase*Math.PI)*.9+Math.sin(t*8)*.05;wL.rotation.x=fa;wR.rotation.x=-fa;
 rim.intensity=fl(rim.intensity,1.4,5,dt)}

const pal=[[0x0b1030,0x38234f],[0x1a2a4a,0x7a3b5e],[0x08101f,0x1b1030]].map(p=>p.map(h=>new THREE.Color(h)));
const tmp=new THREE.Color(0x05060a);
function updEnv(dt,t){const c=(t*.015)%3,i=Math.floor(c),n=(i+1)%3,f=c-i;
 su.top.value.copy(pal[i][0]).lerp(pal[n][0],f);su.bot.value.copy(pal[i][1]).lerp(pal[n][1],f);fog.color.copy(su.bot.value).lerp(tmp,.4);
 starM.opacity=.15+Math.max(0,Math.sin(c*Math.PI))*.35;bg.forEach(l=>l.position.x=Math.sin(t*.05)*6*l.userData.p*40);
 const a=ag.attributes.position,v=state===S.PLAY?speedNow()*.4:2;
 for(let i=0;i<AN;i++){let y=a.array[i*3+1]+dt*.15,z=a.array[i*3+2]+v*dt;if(y>9)y=-8;if(z>10){z=-90;a.array[i*3]=(Math.random()-.5)*26}a.array[i*3+1]=y;a.array[i*3+2]=z}a.needsUpdate=true;
 if(SL){const playing=state===S.PLAY,sv=playing?speedNow()*2.4:0;slM.opacity=fl(slM.opacity,playing?Math.min(.5,.12+(speedNow()-CFG.speed)/40):0,3,dt);
  const p=sg.attributes.position;for(let i=0;i<SL;i++){const d=sv*dt;p.array[i*6+2]+=d;p.array[i*6+5]+=d;if(p.array[i*6+5]>10)resetLine(i,true)}p.needsUpdate=true}
 if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)$('combo').classList.remove('on')}
 gt.offset.y-=0}

const iFrom=new THREE.Vector3(0,34,46),iTo=new THREE.Vector3(),iLF=new THREE.Vector3(0,0,-50),iLT=new THREE.Vector3(),look=new THREE.Vector3(0,0,-10);
function updCam(dt,t){
 if(state===S.INTRO){const p=introStart===null?0:Math.min(1,(t-introStart)/3.2),e=1-Math.pow(1-p,3);
  iTo.set(0,player.position.y+CFG.cam.y,CFG.cam.z);camera.position.lerpVectors(iFrom,iTo,e);iLT.lerpVectors(iLF,look.set(0,player.position.y,-10),e);camera.lookAt(iLT);$('ib').style.width=p*100+'%';
  if(p>=1){state=S.MENU;$('intro').style.opacity=0;setTimeout(()=>$('intro').style.display='none',950);$('menu').classList.add('on')}return}
 const dx=Math.sin(t*.15)*.5;
 camera.position.x=fl(camera.position.x,dx,3,dt);camera.position.y=fl(camera.position.y,player.position.y*.8+CFG.cam.y,4.5,dt);camera.position.z=fl(camera.position.z,CFG.cam.z,4.5,dt);
 const targetFov=CFG.fov+(state===S.PLAY?(speedNow()-CFG.speed)*.35:0)+fovKick*5;fovKick=Math.max(0,fovKick-dt*3);
 if(Math.abs(camera.fov-targetFov)>.01){camera.fov=fl(camera.fov,targetFov,4,dt);camera.updateProjectionMatrix()}
 if(trauma>0&&!reduce){trauma=Math.max(0,trauma-dt*1.6);const s=trauma*trauma;camera.position.x+=(Math.random()-.5)*s*1.1;camera.position.y+=(Math.random()-.5)*s*1.1;camera.rotation.z=(Math.random()-.5)*s*.12}
 else camera.rotation.z=fl(camera.rotation.z,state===S.PLAY?-vy*.006:0,6,dt);
 look.set(dx*.4,player.position.y*.9+.2,player.position.z-12);camera.lookAt(look)}

/* ---------- Input ---------- */
const act=()=>{if(state===S.MENU)start();else if(state===S.PLAY)flap()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)act()}if(e.code==='Escape'||e.code==='KeyP')toggle();if(e.code==='KeyM')Audio.toggle()});
addEventListener('pointerdown',e=>{if(e.target.closest('.screen')||e.target.closest('.btns'))return;act()});
$('pb').onclick=toggle;$('mute').onclick=()=>{Audio.init();Audio.toggle()};$('start').onclick=start;$('resume').onclick=toggle;$('prs').onclick=start;$('again').onclick=start;
document.querySelectorAll('.ib').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state===S.PLAY)toggle()});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('pointerdown',()=>{Audio.init();if(Audio.ctx&&Audio.ctx.state==='suspended')Audio.ctx.resume()},{once:true});
addEventListener('resize',()=>{const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h)});

/* ---------- Loop ---------- */
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);
 const raw=Math.min(clock.getDelta(),.033);elapsed+=raw;const dt=state===S.PAUSE?0:raw*timeScale;
 if(state===S.INTRO&&introStart===null)introStart=elapsed;
 Audio.mix(state,score,raw);updPlayer(dt,elapsed);updEnv(dt,elapsed);updDeb(raw);updRings(dt);updTrail(dt,state===S.PLAY?speedNow():4);
 if(state===S.PLAY)gameplay(dt);
 updCam(raw,elapsed);composer.render()})();
</script></body></html>
